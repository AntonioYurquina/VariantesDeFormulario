<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscripción al Curso</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <main class="container">
    <header>
      <h1>Inscripción al Curso</h1>
      <p>Por favor, completá todos los campos obligatorios</p>
    </header>

    <form id="formInscripcion" novalidate>

      <div class="campo">
        <label for="nombreApellido">Nombre y Apellido</label>
        <input
          type="text"
          id="nombreApellido"
          placeholder="Tu nombre completo"
          autocomplete="off"
          required
        />
        <small class="error-msg" id="errorNombre"></small>
      </div>

      <div class="campo">
        <label for="dni">DNI</label>
        <input
          type="text"
          id="dni"
          placeholder="12345678"
          maxlength="8"
          autocomplete="off"
          required
        />
        <small class="error-msg" id="errorDNI"></small>
      </div>

      <div class="campo">
        <label for="fechaNacimiento">Fecha de Nacimiento</label>
        <input
          type="date"
          id="fechaNacimiento"
          required
        />
        <small class="error-msg" id="errorFecha"></small>
      </div>

      <div id="mensajeExito" class="success-msg"></div>

      <div class="acciones">
        <button type="submit" class="btn btn-primary">Enviar</button>
        <button type="button" id="btnPreguntas" class="btn btn-secondary">Preguntas</button>
      </div>

    </form>

    <section id="respuestasContainer" class="respuestas" style="display: none;">
      <h2>Respuestas</h2>
      <div id="respuestasContenido"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
