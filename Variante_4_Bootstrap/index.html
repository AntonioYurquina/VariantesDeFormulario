<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscripción al Curso</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        
        <div class="card shadow-lg border-0">
          <div class="card-header bg-primary text-white text-center py-4">
            <h1 class="h3 mt-2 mb-1">Inscripción al Curso</h1>
            <p class="mb-0 small">Completá el formulario con tus datos personales</p>
          </div>

          <div class="card-body p-4">
            <form id="formInscripcion" novalidate>

              <!-- Campo: Nombre y Apellido -->
              <div class="mb-3">
                <label for="nombreApellido" class="form-label fw-bold">
                  Nombre y Apellido
                </label>
                <input
                  type="text"
                  class="form-control"
                  id="nombreApellido"
                  placeholder="Ingresá tu nombre completo"
                  autocomplete="off"
                />
                <div class="invalid-feedback d-block" id="errorNombre"></div>
              </div>

              <!-- Campo: DNI -->
              <div class="mb-3">
                <label for="dni" class="form-label fw-bold">
                  DNI
                </label>
                <input
                  type="text"
                  class="form-control"
                  id="dni"
                  placeholder="Ejemplo: 40123456"
                  maxlength="8"
                  autocomplete="off"
                />
                <div class="invalid-feedback d-block" id="errorDNI"></div>
              </div>

              <!-- Campo: Fecha de Nacimiento -->
              <div class="mb-3">
                <label for="fechaNacimiento" class="form-label fw-bold">
                  Fecha de Nacimiento
                </label>
                <input
                  type="date"
                  class="form-control"
                  id="fechaNacimiento"
                />
                <div class="invalid-feedback d-block" id="errorFecha"></div>
              </div>

              <!-- Mensaje de éxito -->
              <div id="mensajeExito" class="alert alert-success d-none" role="alert">
                <span id="textoExito"></span>
              </div>

              <!-- Botones -->
              <div class="d-grid gap-2 d-md-flex mt-4">
                <button type="submit" class="btn btn-primary btn-lg flex-fill">
                  Enviar Inscripción
                </button>
                <button type="button" id="btnPreguntas" class="btn btn-outline-secondary btn-lg flex-fill">
                  Preguntas
                </button>
              </div>

            </form>
          </div>
        </div>

        <!-- Sección de respuestas -->
        <div id="respuestasContainer" class="card shadow-sm border-0 mt-4" style="display: none;">
          <div class="card-header bg-info text-white">
            <strong>Tus Respuestas</strong>
          </div>
          <div class="card-body">
            <div id="respuestasContenido" class="list-group list-group-flush"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
